<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti / Pemulihan Password Resto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-white mb-2 text-center">Keamanan Akun Resto</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Pilih metode pemulihan atau penggantian kata sandi Anda.</p>

        <!-- Tab Navigasi Pilihan -->
        <div class="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
            <button onclick="gantiTab('mandiri')" id="tabMandiri" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition">Ganti Mandiri</button>
            <button onclick="gantiTab('lupa')" id="tabLupa" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 transition">Lupa Password</button>
        </div>

        <!-- FORM 1: GANTI PASSWORD MANDIRI (Pakai Password Lama) -->
        <form id="formMandiri" onsubmit="prosesGantiMandiri(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Username Resto</label>
                <input type="text" id="usernameMandiri" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="Masukkan username resto">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password Lama</label>
                <input type="password" id="passwordLama" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password Baru</label>
                <input type="password" id="passwordBaruMandiri" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>
            
            <div class="flex items-center justify-between pt-2">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition shadow">
                    Simpan Password Baru
                </button>
                <a href="/resto/page/login" class="text-xs text-slate-400 hover:text-white transition">Kembali Login</a>
            </div>
        </form>

        <!-- FORM 2: LUPA PASSWORD (Bantuan Admin + Input Token/Kode Reset) -->
        <form id="formLupa" onsubmit="prosesLupaPassword(event)" class="space-y-4 hidden">
            <div class="bg-amber-950/40 border border-amber-800/60 p-3 rounded-lg text-xs text-amber-300 leading-relaxed">
                ⚠️ Silakan hubungi Admin terlebih dahulu agar Admin mereset akses Anda di panel pusat. Setelah direset oleh Admin, masukkan username dan password baru pilihan Anda di bawah ini.
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Username Resto</label>
                <input type="text" id="usernameLupa" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="Masukkan username resto">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password Baru (Setelah Diizinkan Admin)</label>
                <input type="password" id="passwordBaruLupa" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between pt-2">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition shadow">
                    Simpan Password Baru
                </button>
                <a href="/resto/page/login" class="text-xs text-slate-400 hover:text-white transition">Kembali Login</a>
            </div>
        </form>
    </div>

    <script>
        function gantiTab(tipe) {
            const formMandiri = document.getElementById('formMandiri');
            const formLupa = document.getElementById('formLupa');
            const tabMandiri = document.getElementById('tabMandiri');
            const tabLupa = document.getElementById('tabLupa');

            if (tipe === 'mandiri') {
                formMandiri.classList.remove('hidden');
                formLupa.classList.add('hidden');
                tabMandiri.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition";
                tabLupa.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 transition";
            } else {
                formMandiri.classList.add('hidden');
                formLupa.classList.remove('hidden');
                tabLupa.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition";
                tabMandiri.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 transition";
            }
        }

        async function prosesGantiMandiri(e) {
            e.preventDefault();
            const username = document.getElementById('usernameMandiri').value;
            const passwordLama = document.getElementById('passwordLama').value;
            const passwordBaru = document.getElementById('passwordBaruMandiri').value;

            try {
                const res = await fetch('/resto/api/ganti-password-mandiri', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, passwordLama, passwordBaru })
});
                const result = await res.json();

                if (result.success) {
                    alert('Password lama benar! Password baru berhasil disimpan.');
                    window.location.href = '/resto/page/login';
                } else {
                    alert(result.message || 'Password lama salah!');
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan ke server.');
            }
        }

        async function prosesLupaPassword(e) {
            e.preventDefault();
            const username = document.getElementById('usernameLupa').value;
            const passwordBaru = document.getElementById('passwordBaruLupa').value;

            try {
               const res = await fetch('/resto/api/update-password-baru', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, passwordBaru })
});
                const result = await res.json();

                if (result.success) {
                    alert('Password baru berhasil diterapkan! Silakan login.');
                    window.location.href = '/resto/page/login';
                } else {
                    alert(result.message || 'Gagal memperbarui password.');
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan.');
            }
        }
    </script>
</body>
</html>
